server.port=${PORT:8080}

# MySQL - values come from environment variables when deployed
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rental_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.fail-on-empty-beans=false

# login token settings
app.jwt-secret=${JWT_SECRET:change-this-secret-before-deploying}
app.token-hours=${TOKEN_HOURS:24}
